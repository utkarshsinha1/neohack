name: Package Classroom App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: feric-linux
          - os: windows-latest
            artifact: feric-windows
          - os: macos-latest
            artifact: feric-macos-arm64
          - os: macos-15-intel
            artifact: feric-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package native app image
        if: runner.os != 'Windows'
        run: sh scripts/package.sh
      - name: Package native app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Feric-*.zip
          if-no-files-found: error
